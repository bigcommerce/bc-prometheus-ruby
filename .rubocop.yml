AllCops:
  TargetRubyVersion: 3.3
  Exclude:
    - spec/**/*
    - .bundle/**/*
    - bin/**/*
    - vendor/**/*
    - tmp/**/*
    - log/**/*
    - Rakefile
plugins:
  - rubocop-performance
  - rubocop-rspec

# Allow *VALID_CONFIG_KEYS.keys
Lint/AmbiguousOperator:
  Enabled: false

# This cop conflicts with other cops
Layout/LineLength:
  Enabled: false

# Client carries the delivery path: the queue, the lock, the timeouts and the reporting. Cohesive rather than long,
# and splitting it would mean handing a collaborator most of the client's state.
Metrics/ClassLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 40

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 30

Metrics/ParameterLists:
  Enabled: false

version: 2.1

orbs:
  ci: bigcommerce/internal@volatile
  ruby: bigcommerce/internal-ruby@volatile

defaults: &defaults
  notify_failure: false
  checksumfile: Gemfile

ruby_3_3_defaults: &ruby_3_3_defaults
  <<: *defaults
  cache_key: gem-cache-ruby-3_3
  e:
    name: ruby/ruby
    ruby-version: '3.3'

ruby_3_4_defaults: &ruby_3_4_defaults
  <<: *defaults
  cache_key: gem-cache-ruby-3_4
  e:
    name: ruby/ruby
    ruby-version: '3.4'

ruby_4_0_defaults: &ruby_4_0_defaults
  <<: *defaults
  cache_key: gem-cache-ruby-4_0
  e:
    name: ruby/ruby
    ruby-version: '4.0'

workflows:
  version: 2
  ruby_3_3:
    jobs:
      - ruby/bundle-audit:
          <<: *ruby_3_3_defaults
          name: ruby-3_3-bundle_audit
      - ruby/rubocop:
          <<: *ruby_3_3_defaults
          name: ruby-3_3-rubocop
      - ruby/rspec-unit:
          <<: *ruby_3_3_defaults
          name: ruby-3_3-rspec_unit
          db: false
  ruby_3_4:
    jobs:
      - ruby/bundle-audit:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-bundle_audit
      - ruby/rubocop:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-rubocop
      - ruby/rspec-unit:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-rspec_unit
          db: false
      # These fork real Resque children and need a redis, so `spec_helper` excludes them from any run that
      # does not set FORK_INTEGRATION. This job is the one that sets it, so they always run here. The job is
      # not conditional; the suite is, and this opts in on its behalf.
      #
      # The exclusion is by the :fork_integration tag rather than by directory. `additional_args` alone would
      # not run them, so dropping the hook below stops them running rather than changing which ones do.
      #
      # Both of those now fail rather than pass quietly. A run matching no examples is an error, and a
      # missing redis raises. The ruby executor provides one on localhost:6379, which is where the specs
      # look by default.
      - ruby/rspec-unit:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-rspec_fork_integration
          db: false
          code-climate: false
          report-code-coverage: false
          additional_args: "spec/integration"
          pre-exec-hooks:
            - run:
                name: Enable the fork integration specs
                command: echo 'export FORK_INTEGRATION=1' >> "$BASH_ENV"
  ruby_4_0:
    jobs:
      - ruby/bundle-audit:
          <<: *ruby_4_0_defaults
          name: ruby-4_0-bundle_audit
      - ruby/rubocop:
          <<: *ruby_4_0_defaults
          name: ruby-4_0-rubocop
      - ruby/rspec-unit:
          <<: *ruby_4_0_defaults
          name: ruby-4_0-rspec_unit
          db: false

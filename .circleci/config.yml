version: 2.1

orbs:
  ci: bigcommerce/internal@volatile
  ruby: bigcommerce/internal-ruby@volatile

defaults: &defaults
  notify_failure: false
  checksumfile: Gemfile

ruby_3_3_defaults: &ruby_3_3_defaults
  <<: *defaults
  cache_key: gem-cache-ruby-3_3
  e:
    name: ruby/ruby
    ruby-version: '3.3'

ruby_3_4_defaults: &ruby_3_4_defaults
  <<: *defaults
  cache_key: gem-cache-ruby-3_4
  e:
    name: ruby/ruby
    ruby-version: '3.4'

ruby_4_0_defaults: &ruby_4_0_defaults
  <<: *defaults
  cache_key: gem-cache-ruby-4_0
  e:
    name: ruby/ruby
    ruby-version: '4.0'

workflows:
  version: 2
  ruby_3_3:
    jobs:
      - ruby/bundle-audit:
          <<: *ruby_3_3_defaults
          name: ruby-3_3-bundle_audit
      - ruby/rubocop:
          <<: *ruby_3_3_defaults
          name: ruby-3_3-rubocop
      - ruby/rspec-unit:
          <<: *ruby_3_3_defaults
          name: ruby-3_3-rspec_unit
          db: false
  ruby_3_4:
    jobs:
      - ruby/bundle-audit:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-bundle_audit
      - ruby/rubocop:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-rubocop
      - ruby/rspec-unit:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-rspec_unit
          db: false
      # These fork real Resque children and need a redis. The specs tag their `describe` with
      # :fork_integration, and spec/spec_helper.rb excludes that tag unless FORK_INTEGRATION is set. The
      # hook below sets it, which is the only reason they run here.
      #
      # `additional_args` just picks the directory. Without the hook this job would run nothing.
      - ruby/rspec-unit:
          <<: *ruby_3_4_defaults
          name: ruby-3_4-rspec_fork_integration
          db: false
          code-climate: false
          report-code-coverage: false
          additional_args: "spec/integration"
          pre-exec-hooks:
            - run:
                name: Enable the fork integration specs
                command: echo 'export FORK_INTEGRATION=1' >> "$BASH_ENV"
  ruby_4_0:
    jobs:
      - ruby/bundle-audit:
          <<: *ruby_4_0_defaults
          name: ruby-4_0-bundle_audit
      - ruby/rubocop:
          <<: *ruby_4_0_defaults
          name: ruby-4_0-rubocop
      - ruby/rspec-unit:
          <<: *ruby_4_0_defaults
          name: ruby-4_0-rspec_unit
          db: false
